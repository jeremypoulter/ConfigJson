name: Platform IO

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - example: load_config
          board: huzzah
        - example: load_config
          board: esp-wrover-kit
        - example: load_config
          board: huzzah-v7
        - example: load_config
          board: esp-wrover-kit-v7
        - example: virtual_bool_flags
          board: huzzah

    runs-on: ubuntu-latest
    name: Build ${{ matrix.example }}-${{ matrix.board }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6

      - name: Install Platform IO
        run:
          |
          pip install -U platformio
          platformio update

      - name: Install Checked out ConfigJSON
        run:
          pio lib -g install $GITHUB_WORKSPACE

      - name: Build example 
        run:
          |
          cd examples/${{ matrix.example }}
          pio run -e ${{ matrix.board }}
