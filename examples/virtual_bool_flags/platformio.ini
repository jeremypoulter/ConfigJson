;PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:huzzah]
platform = espressif8266
board = huzzah
framework = arduino
lib_deps = ConfigJson

[env:huzzah-v7]
platform = espressif8266
board = huzzah
framework = arduino
lib_deps =
  ConfigJson
  bblanchon/ArduinoJson@^7.0.0

[env:huzzah-v6]
platform = espressif8266
board = huzzah
framework = arduino
lib_deps =
  ConfigJson
  bblanchon/ArduinoJson@^6.21.0

[env:esp-wrover-kit]
platform = espressif32
framework = arduino
board = esp-wrover-kit
lib_deps = ConfigJson

[env:esp-wrover-kit-v7]
platform = espressif32
framework = arduino
board = esp-wrover-kit
lib_deps =
  ConfigJson
  bblanchon/ArduinoJson@^7.0.0

[env:esp-wrover-kit-v6]
platform = espressif32
framework = arduino
board = esp-wrover-kit
lib_deps =
  ConfigJson
  bblanchon/ArduinoJson@^6.21.0

[env:uno]
platform = atmelavr
framework = arduino
board = uno
lib_deps = ConfigJson

[env:uno-v6]
platform = atmelavr
framework = arduino
board = uno
lib_deps =
  ConfigJson
  bblanchon/ArduinoJson@^6.21.0
