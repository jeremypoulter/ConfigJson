;PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[common]
lib_deps = ConfigJson
monitor_speed = 115200
monitor_port = /dev/ttyUSB1
build_flags = 
  -DENABLE_DEBUG
#  -DCS_ENABLE_STDIO

[env:huzzah]
platform = espressif8266
board = huzzah
framework = arduino
monitor_speed = ${common.monitor_speed}
monitor_port = ${common.monitor_port}
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags}

[env:huzzah-v7]
platform = espressif8266
board = huzzah
framework = arduino
monitor_speed = ${common.monitor_speed}
monitor_port = ${common.monitor_port}
lib_deps =
  ${common.lib_deps}
  bblanchon/ArduinoJson@^7.0.0
build_flags = ${common.build_flags}


[env:huzzah-v6]
platform = espressif8266
board = huzzah
framework = arduino
monitor_speed = ${common.monitor_speed}
monitor_port = ${common.monitor_port}
lib_deps =
  ${common.lib_deps}
  bblanchon/ArduinoJson@^6.21.0
build_flags = ${common.build_flags}

[env:esp-wrover-kit]
platform = espressif32
framework = arduino
board = esp-wrover-kit
monitor_speed = ${common.monitor_speed}
monitor_port = ${common.monitor_port}
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags}

[env:esp-wrover-kit-v7]
platform = espressif32
framework = arduino
board = esp-wrover-kit
monitor_speed = ${common.monitor_speed}
monitor_port = ${common.monitor_port}
lib_deps =
  ${common.lib_deps}
  bblanchon/ArduinoJson@^7.0.0
build_flags = ${common.build_flags}


[env:esp-wrover-kit-v6]
platform = espressif32
framework = arduino
board = esp-wrover-kit
monitor_speed = ${common.monitor_speed}
monitor_port = ${common.monitor_port}
lib_deps =
  ${common.lib_deps}
  bblanchon/ArduinoJson@^6.21.0
build_flags = ${common.build_flags}

[env:uno]
platform = atmelavr
framework = arduino
board = uno
monitor_speed = ${common.monitor_speed}
monitor_port = ${common.monitor_port}
lib_deps = ${common.lib_deps}
# MicroDebug's DBUGF calls printf on the serial port, which the AVR core lacks,
# so debug output stays off on AVR.
build_flags =


[env:uno-v6]
platform = atmelavr
framework = arduino
board = uno
monitor_speed = ${common.monitor_speed}
monitor_port = ${common.monitor_port}
lib_deps =
  ${common.lib_deps}
  bblanchon/ArduinoJson@^6.21.0
# MicroDebug's DBUGF calls printf on the serial port, which the AVR core lacks,
# so debug output stays off on AVR.
build_flags =

[env:nrf52_dk]
platform = nordicnrf52
framework = arduino
board = nrf52840_dk_adafruit
monitor_speed = ${common.monitor_speed}
monitor_port = ${common.monitor_port}
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags}
