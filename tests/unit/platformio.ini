[platformio]
src_dir = ../../src
test_dir = test

; Native tests build against EpoxyDuino, which provides Arduino.h for each core
; and the EEPROM emulation. EPOXY_DUINO_DIR is a checkout of
; jeremypoulter/EpoxyDuino (CI checks it out alongside ConfigJson).
;
; Each core is a pair of environments, for ArduinoJson v7 and v6:
;   native, native_v6                 ESP32 core (the firmware's platform)
;   native_esp8266, native_esp8266_v6 ESP8266 core
;   native_avr, native_avr_v6         AVR core
; EpoxyEepromEsp is for the ESP cores and EpoxyEepromAvr for AVR, so each core
; ignores the other one.

[env]
platform = native
test_framework = unity
test_build_src = yes
lib_deps =
  ${sysenv.EPOXY_DUINO_DIR}
lib_extra_dirs = ${sysenv.EPOXY_DUINO_DIR}/libraries
build_flags =
  -std=gnu++14
  -I include
  -I ../../src
  -DARDUINO=10800
  -DEPOXY_DUINO
  --coverage
  -lgcov

[arduinojson_v7]
lib_deps =
  ${env.lib_deps}
  bblanchon/ArduinoJson@^7.0.0

[arduinojson_v6]
lib_deps =
  ${env.lib_deps}
  bblanchon/ArduinoJson@^6.21.0

[core_esp32]
build_flags =
  ${env.build_flags}
  -DEPOXY_CORE_ESP32
lib_ignore = EpoxyEepromAvr

[core_esp8266]
build_flags =
  ${env.build_flags}
  -DEPOXY_CORE_ESP8266
lib_ignore = EpoxyEepromAvr

[core_avr]
build_flags =
  ${env.build_flags}
  -DEPOXY_CORE_AVR
lib_ignore = EpoxyEepromEsp

[env:native]
extends = core_esp32, arduinojson_v7

[env:native_v6]
extends = core_esp32, arduinojson_v6

[env:native_esp8266]
extends = core_esp8266, arduinojson_v7

[env:native_esp8266_v6]
extends = core_esp8266, arduinojson_v6

[env:native_avr]
extends = core_avr, arduinojson_v7

[env:native_avr_v6]
extends = core_avr, arduinojson_v6
