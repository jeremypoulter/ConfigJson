[platformio]
src_dir = ../../src
test_dir = test

[env:native]
platform = native
test_framework = unity
test_build_src = yes
lib_deps =
  https://github.com/jeremypoulter/EpoxyDuino.git#4f3f0db2b9c31656da828f21838d0a30f7417370
  bblanchon/ArduinoJson@^7.0.0
build_flags =
  -std=gnu++11
  -I include
  -I ../../src
  -DARDUINO=10800
  -DEPOXY_DUINO
  --coverage
  -lgcov

; ConfigJson explicitly supports ArduinoJson v6 as well as v7 (see the
; ARDUINOJSON_VERSION_MAJOR checks in src/), so the suite runs against both.
; This env isn't coverage-instrumented; [env:native] above is the one CI
; reports coverage from.
[env:native_v6]
platform = native
test_framework = unity
test_build_src = yes
lib_deps =
  https://github.com/jeremypoulter/EpoxyDuino.git#4f3f0db2b9c31656da828f21838d0a30f7417370
  bblanchon/ArduinoJson@^6.21.0
build_flags =
  -std=gnu++11
  -I include
  -I ../../src
  -DARDUINO=10800
  -DEPOXY_DUINO
